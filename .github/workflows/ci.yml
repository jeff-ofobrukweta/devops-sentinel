name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS collect memory differently (os.freemem vs vm_stat).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit, scenario and integration tests with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Smoke test the built CLI
        # Exit codes 0-3 are valid health states; anything else is a failure.
        run: node dist/cli.js --once --no-color || [ $? -le 3 ]

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: devops-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container produces a valid report
        run: |
          set +e
          docker run --rm devops-sentinel:ci --once --format json > report.json
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -le 3
          jq -e '.schemaVersion == 1 and .host.containerized == true and (.metrics | length) == 3' report.json

      - name: Container runs as a non-root user
        run: test "$(docker run --rm --entrypoint id devops-sentinel:ci -u)" != "0"

      - name: Memory is measured against the container's cgroup limit
        run: |
          docker run --rm --memory=256m devops-sentinel:ci --once --format json \
            | jq -e '.metrics[] | select(.name == "memory") | .details.source == "cgroup" and .details.totalBytes == 268435456'

      - name: CPU is measured against the container's cgroup quota
        run: |
          docker run --rm --cpus=0.5 devops-sentinel:ci --once --format json \
            | jq -e '.metrics[] | select(.name == "cpu") | .details.source == "cgroup" and .details.limitCpus == 0.5'

      - name: Container stops gracefully on SIGTERM
        run: |
          docker run -d --name sentinel devops-sentinel:ci --interval 60
          sleep 3
          docker stop --timeout 5 sentinel
          test "$(docker inspect -f '{{.State.ExitCode}}' sentinel)" = "0"
          docker logs sentinel 2>&1 | grep -q 'Monitoring stopped'
          docker rm sentinel
